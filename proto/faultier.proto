syntax = "proto3";

enum FaultierVersion {
    FAULTIER_VERSION_ZERO = 0;
    FAULTIER_VERSION = 2;
}

enum Commands {
    CMD_RESET = 0;
    CMD_GLITCH = 1;
    CMD_CAPTURE = 2;
}

enum TriggerSource {
    TRIGGER_IN_NONE = 0;
    TRIGGER_IN_EXT0 = 1;
    TRIGGER_IN_EXT1 = 2;
}

enum GlitchOutput {
    OUT_CROWBAR = 0;
    OUT_MUX0 = 1;
    OUT_MUX1 = 2;
    OUT_MUX2 = 3;
    OUT_EXT0 = 4;
    OUT_EXT1 = 5;
    OUT_NONE = 6;
}

enum TriggersType {
    TRIGGER_NONE = 0;
    TRIGGER_HIGH = 1;
    TRIGGER_LOW = 2;
    TRIGGER_RISING_EDGE = 3;
    TRIGGER_FALLING_EDGE = 4;
    TRIGGER_PULSE_POSITIVE = 5;
    TRIGGER_PULSE_NEGATIVE = 6;
}

enum ADCSource {
    ADC_CROWBAR = 0;
    ADC_MUX0 = 1;
    ADC_EXT1 = 2;
}

enum AuxFunction {
    AUX_NONE = 0;
    AUX_UART = 1;
    AUX_SWD_CHECKER = 2;
    AUX_SWD_PROBE = 3;
}

message CaptureResponse {
    bytes data = 1;
}

message CommandHello {}

message CommandCapture {}

message CommandGlitch {}

enum SWDCheckFunction {
    SWD_CHECK_ENABLED = 0;
    SWD_CHECK_NRF52 = 1;
}

enum TriggerPullConfiguration {
    TRIGGER_PULL_NONE = 0;
    TRIGGER_PULL_UP = 1;
    TRIGGER_PULL_DOWN = 2;
}

message CommandSWDCheck {
    SWDCheckFunction function = 1;
}

message CommandConfigureGlitcher {
    GlitchOutput power_cycle_output = 7;
    int32 power_cycle_length = 8;
    TriggersType trigger_type = 1;
    int32 delay = 2;
    int32 pulse = 3;
    TriggerSource trigger_source = 4;
    GlitchOutput glitch_output = 5;
    TriggerPullConfiguration trigger_pull_configuration = 6;
}

message CommandConfigureADC {
    ADCSource source = 1;
    int32 sample_count = 2;
    int32 clock_division = 3;
}

message CommandReadADC {
}

enum SWIMFunction {
    SWIM_ENTER = 0;
    SWIM_EXIT = 1;
    SWIM_SRST = 2;
    SWIM_READ = 3;
    SWIM_WRITE = 4;
}

// STM8 SWIM (UM0470) debug access on IO8, with NRST on the SWD header's RST pin.
message CommandSWIM {
    SWIMFunction function = 1;
    // SWIM_READ / SWIM_WRITE: 24-bit target address.
    uint32 address = 2;
    // SWIM_READ: number of bytes, 1 to 1024.
    uint32 length = 3;
    // SWIM_WRITE: the bytes to write, 1 to 128 (sent as a single WOTF).
    bytes data = 4;
    // SWIM_ENTER: attach to a running target instead of holding NRST low
    // during entry. Fails if the application has turned SWIM into a GPIO.
    bool hot_attach = 5;
    // SWIM_ENTER tuning, 0 = firmware default. Length of the first low pulse
    // of the entry sequence (default 16 us, as in UM0470).
    uint32 entry_low_us = 6;
    // SWIM_ENTER tuning, 0 = firmware default. Longest accepted rise time of
    // the released line before giving up on a missing pull-up (default
    // 250 ns: a '0' bit is high for only 2 SWIM clocks).
    uint32 max_rise_ns = 7;
}

// Answer ResponseOk, then reboot into the RP2040 USB bootloader (as if BOOTSEL
// had been held), so new firmware can be copied over without the button.
message CommandRebootBootloader {}

message Command {
    oneof cmd {
        CommandHello hello = 1;
        CommandConfigureGlitcher configure_glitcher = 2;
        CommandConfigureADC configure_adc = 8;
        CommandCapture capture = 4;
        CommandGlitch glitch = 5;
        CommandReadADC read_adc = 6;
        CommandSWDCheck swd_check = 7;
        CommandSWIM swim = 9;
        CommandRebootBootloader reboot_bootloader = 10;
    }
}

message ResponseOk {

}

message ResponseError {
    string message = 1;
}

message ResponseHello {
    FaultierVersion version = 1;
    // Set by firmware that implements CommandSWIM. Older firmware leaves it
    // false (and silently drops CommandSWIM), so the host can refuse early.
    bool supports_swim = 2;
}

message ResponseTriggerTimeout {
}

message ResponseADC {
    bytes samples = 1;
    //int32 test = 2;
}

message ResponseInfo {
    int32 frequency = 1;
}

message ResponseSWDCheck {
    bool enabled = 1;
}

message ResponseSWIM {
    // SWIM_READ: the bytes read.
    bytes data = 1;
    // SWIM_ENTER: measured length of the target's synchronisation frame
    // (128 SWIM clocks, nominally 16000 ns for an 8 MHz SWIM clock).
    uint32 sync_ns = 2;
    // SWIM_ENTER: measured rise time of the released line.
    uint32 rise_ns = 3;
}

message Response {
    oneof type {
        ResponseOk ok = 1;
        ResponseError error = 2;
        ResponseHello hello = 3;
        ResponseADC adc = 4;
        ResponseTriggerTimeout trigger_timeout = 5;
        ResponseSWDCheck swd_check = 6;
        ResponseSWIM swim = 7;
    }
}
